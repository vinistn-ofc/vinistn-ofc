<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - App de Tarefas Profissional</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="todo-site">
            <header class="site-header">
                <h1><i class="fas fa-tasks"></i> To-Do List</h1>
                <p>Sistema profissional de gerenciamento de tarefas e produtividade</p>
            </header>

            <section class="todo-input-section">
                <div class="input-container">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Adicione uma nova tarefa..."
                        maxlength="100"
                    >
                    <button id="addBtn" class="add-btn">
                        <i class="fas fa-plus"></i>
                        Adicionar
                    </button>
                </div>
                <div class="input-stats">
                    <span id="charCount">0 / 100 caracteres</span>
                </div>
            </section>

            <section class="todo-filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i>
                        Todas
                        <span class="count" id="allCount">0</span>
                    </button>
                    <button class="filter-btn" data-filter="pending">
                        <i class="fas fa-clock"></i>
                        Pendentes
                        <span class="count" id="pendingCount">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i>
                        Concluídas
                        <span class="count" id="completedCount">0</span>
                    </button>
                </div>
            </section>

            <section class="todo-content">
                <div class="todo-list" id="todoList">
                    <!-- Tarefas serão inseridas aqui dinamicamente -->
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3>Nenhuma tarefa encontrada</h3>
                    <p>Adicione sua primeira tarefa para começar!</p>
                </div>

                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Carregando tarefas...</p>
                </div>
            </section>

            <footer class="todo-footer">
                <div class="stats">
                    <div class="stat-item">
                        <i class="fas fa-chart-pie"></i>
                        <span id="progressText">0% concluído</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="actions">
                    <button id="clearCompleted" class="clear-btn">
                        <i class="fas fa-trash"></i>
                        Limpar Concluídas
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
